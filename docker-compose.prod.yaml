services:
  postgres:
    image: postgres:15-alpine
    container_name: liga-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: liga_db
    volumes:
      - postgres-liga-data:/var/lib/postgresql/data
    networks:
      - liga
    ports:
      # So no loopback: o banco continua acessivel por tunel SSH, mas nao pela internet.
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d liga_db']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    container_name: liga-api
    # A imagem e buildada no proprio servidor (nao ha pipeline de ECR neste repo).
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      # Producao le o .env.prod; o .env e do ambiente de desenvolvimento. Ver DEPLOY.md.
      - .env.prod
    command: sh -c "npx prisma migrate deploy && npm run start:prod"
    depends_on:
      postgres:
        # O boot roda "prisma migrate deploy": sem esperar o banco aceitar
        # conexao, a migracao falha e a api nao sobe.
        condition: service_healthy
    networks:
      - liga

  nginx:
    image: nginx:latest
    container_name: liga-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      - liga

volumes:
  postgres-liga-data:
    driver: local

networks:
  liga:
    driver: bridge

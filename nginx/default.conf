server {
    listen 80;
    server_name back.ligadealgoritmos.com;

    # Desafio ACME do certbot (renovacao via webroot, issue #37). Tem que vir
    # ANTES do "return 301": e um bare directive no bloco "server" equivale a
    # uma location "/" normal, e "^~" garante que esta location ganha por ser
    # mais especifica, sem precisar reordenar nada mais. O certbot escreve o
    # token em /var/www/certbot/.well-known/acme-challenge/, montado :ro aqui
    # (o certbot do host grava, o container so le).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name back.ligadealgoritmos.com;

    client_max_body_size 100M;

    ssl_certificate     /etc/letsencrypt/live/back.ligadealgoritmos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/back.ligadealgoritmos.com/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # DNS interno do Docker. Com o upstream numa variavel, o nome "api" e
    # resolvido a cada requisicao em vez de no boot: se a api estiver fora do ar
    # durante um deploy, o nginx devolve 502 temporario em vez de sair com
    # "host not found in upstream" e entrar em crash-loop.
    # ipv6=off porque a rede "liga" e bridge IPv4: sem isso o nginx ainda
    # dispara a consulta AAAA a cada resolucao, so para descartar a resposta.
    resolver 127.0.0.11 ipv6=off valid=10s;

    location / {
        set $upstream api:3000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

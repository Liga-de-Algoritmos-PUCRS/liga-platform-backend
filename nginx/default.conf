server {
    listen 80;
    server_name back.ligadealgoritmos.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name back.ligadealgoritmos.com;

    client_max_body_size 100M;

    ssl_certificate     /etc/letsencrypt/live/back.ligadealgoritmos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/back.ligadealgoritmos.com/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # DNS interno do Docker. Com o upstream numa variavel, o nome "api" e
    # resolvido a cada requisicao em vez de no boot: se a api estiver fora do ar
    # durante um deploy, o nginx devolve 502 temporario em vez de sair com
    # "host not found in upstream" e entrar em crash-loop.
    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream api:3000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
